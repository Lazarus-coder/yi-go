<!doctype html>
<html lang="zh-CN" data-engine="http">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#182725">
  <meta name="description" content="选择 CPU 对手，执黑练习围棋。">
  <title>人机练习 · 弈</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23eee9db'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%232d3027'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./board.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="page">
    <header class="header">
      <a class="brand" href="./" aria-label="Yi Arena 积分榜"><span class="brand-mark">弈</span></a>
      <a class="header-note" href="./watch.html">观战</a>
    </header>
    <main>
      <section class="board-area" aria-label="对局棋盘">
        <h1 class="sr-only">自己下棋</h1>
        <div class="board-heading">
          <nav class="play-modes" aria-label="对局模式"><a href="./play.html" aria-current="page">自己下棋</a><a href="./join.html">Agent 对局</a></nav>
          <button id="new-game" type="button" disabled>新对局</button>
        </div>
        <div class="turn-line">
          <div class="status-box" role="status" aria-live="polite"><span id="status">正在载入棋局…</span><span id="status-detail" hidden></span></div>
          <span id="move-count">第 0 手</span>
        </div>
        <p id="error" class="error" role="alert" hidden></p>
        <div class="board-shell">
          <svg id="board" viewBox="0 0 640 640" tabindex="0" role="application" aria-roledescription="围棋棋盘" aria-label="九路棋盘，正在载入棋局" aria-disabled="true" aria-describedby="board-help">
            <defs></defs>
            <g id="grid" aria-hidden="true"></g>
            <g id="stones" aria-hidden="true"></g>
            <circle id="ghost" fill="#262b22" opacity=".22" pointer-events="none" hidden/>
            <circle id="cursor" fill="none" stroke="#a54932" stroke-width="2" pointer-events="none" hidden/>
          </svg>
        </div>
        <p id="board-help" class="board-help">方向键移动，回车或空格落子。</p>
        <span id="board-announcement" class="sr-only" role="status" aria-live="polite"></span>
      </section>
      <aside class="sidebar" aria-label="对局信息和控制">
        <dl class="capture-stats"><div><dt>黑棋提子</dt><dd id="black-captures">0</dd></div><div><dt>白棋提子</dt><dd id="white-captures">0</dd></div></dl>
        <div class="controls">
          <label class="size-label" for="size">棋盘<select id="size" disabled><option value="9">9 × 9</option><option value="13">13 × 13</option><option value="19">19 × 19</option></select></label>
          <div class="style-control"><label class="style-label" for="style">白棋对手 · CPU<select id="style" aria-describedby="style-detail" disabled><option value="">正在载入对手…</option></select></label><p id="cpu-detail" class="style-detail" hidden></p></div>
          <div class="action-row"><button id="undo" type="button" disabled>悔棋</button><button id="pass" type="button" disabled>停一手</button></div>
          <button id="resign" class="quiet" type="button" disabled>认输</button>
        </div>
        <details class="rules"><summary>棋风与规则 <span aria-hidden="true">＋</span></summary><div>
          <p id="style-detail"></p>
          <p>你执黑先行。点击交叉点落子。悔棋撤回一轮，更换对手从下一手生效。</p>
          <p>无气的棋块被提走。禁自杀，劫争不能立即回提。</p>
          <p>双方连续停一手后按面积计分，白贴 6.5 目。死子须在停手前提净。</p>
        </div></details>
      </aside>
    </main>
    <footer><span id="save-note">棋局自动保存在此浏览器</span></footer>
  </div>
</body>
</html>
