name: Go and standalone HTML
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: sh scripts/build-pages.sh
      - run: node scripts/smoke-wasm.mjs
      - run: node --test scripts/engine.test.mjs
      - run: node scripts/build-html.mjs
      - run: node --test scripts/html.test.mjs
